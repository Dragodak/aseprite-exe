name: aseprite

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Aseprite tag to build, for example v1.3.18.3; leave empty for latest"
        required: false
      repository:
        description: "Aseprite Git repository to build"
        required: false
        default: "https://github.com/aseprite/aseprite.git"
      version_suffix:
        description: "Branding suffix, usually draglus-dev or draglus"
        required: false
        default: "draglus-dev"

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    env:
      ASEPRITE_VERSION: ${{ github.event.inputs.version }}
      ASEPRITE_REPOSITORY: ${{ github.event.inputs.repository }}
      ASEPRITE_UPSTREAM_REPOSITORY: https://github.com/aseprite/aseprite.git
      DRAGLUS_VERSION_SUFFIX: ${{ github.event.inputs.version_suffix }}

    steps:
      - name: Checkout build files
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            clang cmake curl g++ git libc++-dev libc++abi-dev ninja-build \
            unzip libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          command -v cmake >/dev/null 2>&1 || brew install cmake
          command -v ninja >/dev/null 2>&1 || brew install ninja

      - name: Build Windows package
        if: runner.os == 'Windows'
        id: windows-build
        shell: cmd
        run: call build.cmd

      - name: Build Linux package
        if: runner.os == 'Linux'
        id: linux-build
        shell: bash
        run: bash build.sh

      - name: Build macOS package
        if: runner.os == 'macOS'
        id: macos-build
        shell: bash
        run: bash build.sh

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ matrix.platform }}-${{ steps.windows-build.outputs.ASEPRITE_VERSION }}
          path: github
          if-no-files-found: error

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ matrix.platform }}-${{ steps.linux-build.outputs.ASEPRITE_VERSION }}
          path: github
          if-no-files-found: error

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-${{ matrix.platform }}-${{ steps.macos-build.outputs.ASEPRITE_VERSION }}
          path: github
          if-no-files-found: error
